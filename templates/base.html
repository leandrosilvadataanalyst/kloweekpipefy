<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestão de Squads - Kloh & Co{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'montserrat': ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        'primary': {
                            'black': '#000000',
                            'white': '#FFFFFF',
                        },
                        'green': {
                            'dark': '#1B5E20',
                            'light': '#4CAF50',
                            'bg': '#E8F5E9',
                        },
                        'red': {
                            'dark': '#B71C1C',
                            'light': '#F44336',
                            'bg': '#FFEBEE',
                        },
                        'gray': {
                            'dark': '#424242',
                            'light': '#9E9E9E',
                            'bg': '#F5F5F5',
                            'border': '#E0E0E0',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-bg font-montserrat">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-primary-black text-primary-white flex flex-col">
            <div class="p-6 border-b border-gray-dark">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center">
                        <span class="text-primary-black font-bold text-xl">K</span>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg">Kloh & Co</h1>
                    </div>
                </div>
            </div>
            
            <nav class="flex-1 p-4">
                <ul class="space-y-2">
                    <li>
                        <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors {% if request.path == '/' %}bg-primary-white text-primary-black{% else %}text-gray-light hover:bg-gray-dark{% endif %}">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                            </svg>
                            Visão Geral
                        </a>
                    </li>
                    <li>
                        <a href="/roi" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors {% if request.path == '/roi' %}bg-red-light text-primary-white{% else %}text-gray-light hover:bg-gray-dark{% endif %}">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                            </svg>
                            ROI
                        </a>
                    </li>
                </ul>
            </nav>
            
            <div class="p-4 border-t border-gray-dark">
                <a href="/logout" class="flex items-center gap-3 px-4 py-3 text-gray-light hover:text-primary-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                    Sair
                </a>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="flex-1">
            <!-- Header -->
            <header class="bg-primary-black text-primary-white px-8 py-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-white rounded-lg flex items-center justify-center">
                            <span class="text-primary-black font-bold text-2xl">K</span>
                        </div>
                        <h1 class="text-2xl font-bold">{% block page_title %}Dashboard{% endblock %}</h1>
                    </div>
                    
                    <div class="flex items-center gap-4">
                        {% block filters %}{% endblock %}
                    </div>
                </div>
            </header>
            
            <!-- Page Content -->
            <div class="p-8">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    
    {% block scripts %}{% endblock %}
</body>
</html>
